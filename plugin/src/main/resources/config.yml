# =========================================================
#  SiteSync — аккаунты AuthMe → сайт Сфинксляндии
#  После изменения настроек введи /sitesync reload — перезапуск сервера не нужен.
# =========================================================

supabase:
  # Supabase → Project Settings → API → Project URL
  url: "https://pkgczzfhssfdjyunadmy.supabase.co"
  # СЕКРЕТНЫЙ ключ: Project Settings → API Keys → secret (sb_secret_…) или service_role.
  # Храни только здесь, на сервере. Никогда не вставляй его на сайт и не показывай в Discord.
  service-key: ""

site:
  url: "https://mngkonov.github.io/sphinxland/"
  # Служебный домен для аккаунтов из игры (вход на сайт по нику).
  # Должен совпадать с полем «Домен аккаунтов из игры» в админке сайта.
  email-domain: "players.mngkonov.github.io"

# Префикс ников Bedrock-игроков из Floodgate (config.yml Floodgate → username-prefix)
bedrock-prefix: "."

# Как часто перечитывать базу AuthMe и досоздавать профили (в минутах)
sync-interval-minutes: 10

authme:
  # Путь к базе AuthMe (SQLite). Относительный путь считается от папки сервера.
  database: "plugins/AuthMe/authme.db"
  table: "authme"
  # Названия колонок — как в plugins/AuthMe/config.yml (DataSource.mySQLColumn…)
  columns:
    name: "username"
    realname: "realname"
    regdate: "regdate"
    lastlogin: "lastlogin"

messages:
  ready: "&6[Сайт] &fПрофиль на сайте готов! Входи по нику &e{nick}&f и игровому паролю: &e{url}account.html"
  weak-password: "&6[Сайт] &fСайт не принял твой пароль — он слишком короткий. Смени его командой &e/changepassword&f, чтобы входить на сайт."
