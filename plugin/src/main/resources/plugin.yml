name: SiteSync
version: 1.2.0
main: ru.sphinxland.sitesync.SiteSync
api-version: '1.21'
depend: [AuthMe]
softdepend: [floodgate, SkinsRestorer]
description: Аккаунты AuthMe, скины, статистика и статус «в игре» на сайте Сфинксляндии
commands:
  sitesync:
    description: Статус и ручная синхронизация с сайтом
    usage: /sitesync [status|sync|reload]
    permission: sitesync.admin
permissions:
  sitesync.admin:
    description: Команда /sitesync
    default: op
